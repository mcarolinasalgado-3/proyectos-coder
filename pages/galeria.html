        <nav class="navbar navbar-expand-lg bg-body-tertiary">

                    <img src="../img/elgalpon-logo.jpg" alt="logo de El Galpón">

                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <h1 class="lobster-regular">¡Conocé nuestras cervezas!</h1>

        <section class="galeria">
            <figure>
                <img src="../img/barley.jpg" alt="Cerveza Barley" data-aos="zoom-in">
                <figcaption class="texto-imagenes" data-aos="fade-up" data-aos-delay="100">Cerveza Barley: Del estilo Ale
                    muy fuerte y complejo, con un contenido de alcohol de 8% a 12% o más.</figcaption>
            </figure>
            <figure>
                <img src="../img/blackipa.jpg" alt="Cerveza Black Ipa" data-aos="zoom-in">
                <figcaption class="texto-imagenes" data-aos="fade-up" data-aos-delay="100"> Cerveza Black Ipa: Es un
                    estilo híbrido que combina la apariencia oscura y el sutil trasfondo de una malta tostada con el
                    potente amargor, sabor y aroma a lúpulo.
                </figcaption>
            </figure>
            <figure>
                <img src="../img/bock.jpg" alt="Cerveza Bock" data-aos="zoom-in">
                <figcaption class="texto-imagenes" data-aos="fade-up" data-aos-delay="100"> Cerveza Bock: Estilo
                    tradicional alemán de baja fermentación (lager), famoso por su cuerpo robusto, su graduación
                    alcohólica elevada (usualmente entre 6% y 7,5%).</figcaption>
            </figure>
            <figure>
                <img src="../img/frambuesa.jpg" alt="Cerveza Frambuesa" data-aos="zoom-in">
                <figcaption class="texto-imagenes" data-aos="fade-up" data-aos-delay="100"> Cerveza Strawberry: La
                    frutal más popular del mundo, caracterizada por su balance entre el dulzor natural de la fruta y
                    notas sutilmente ácidas o refrescantes.
                </figcaption>
            </figure>
            <figure>
                <img src="../img/honey.jpg" alt="Cerveza Honey" data-aos="zoom-in">
                <figcaption class="texto-imagenes" data-aos="fade-up" data-aos-delay="100"> Cerveza Honey: Ofrece un
                    color dorado intenso, cuerpo moderado, bajo amargor y un aroma floral característico.</figcaption>
            </figure>
            <figure>
                <img src="../img/ipa.jpg" alt="Cerveza IPA" data-aos="zoom-in">
                <figcaption class="texto-imagenes" data-aos="fade-up" data-aos-delay="100"> Cerveza IPA: De alta
                    fermentación que destaca por su intenso amargor, aroma frutal o cítrico y mayor graduación
                    alcohólica. </figcaption>
            </figure>
        </section>
    </main>
