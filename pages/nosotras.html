        </aside>

        <section>
            <figure class="tarjeta">
                <img src="../img/quienes-somos.jpg" alt="Foto del equipo" data-aos="zoom-in">
                <figcaption class="texto-imagenes" data-aos="fade-up" data-aos-delay="100">Este proyecto, El Galpón,
                    surgió en un asado entre amigas. Todas queríamos tener un proyecto en común y qué mejor que sea algo
                    que nos guste a todas. Pensando en algo que compartieramos, cosa no fácil, no tuvimos que ir muy
                    lejos para darnos cuenta de que eso era la birra. Así nació El Galpón. Después de varios cursos de
                    cómo producir cerveza y, después de varios errores y aciertos, llega la mejor birra que vas a
                    probar... pero posta. ¿No nos creés? ¡Animate y probá!</figcaption>
