    <!-- Google Fonts -->

        rel="stylesheet">
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container-fluid">
                <a class="navbar-brand" href="../index.html">
                    <img src="../img/elgalpon-logo.jpg" alt="logo de El Galpón">
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">

                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <h1 class="lobster-regular">¡Contactanos!</h1>

        <form action="#" data-aos="fade-up">
            <fieldset>
                <legend class="texto-footer">Datos personales</legend>
                <label class="texto-footer">Nombre <input type="text"></label>
                <label class="texto-footer">Apellido <input type="text"></label>
            </fieldset>
            <label class="texto-footer">Comentarios <textarea name="Comentario"
                    placeholder="Dejanos tu comentario..."></textarea></label>
            <button value="Submit">Enviar</button>
        </form>

        <h2 data-aos="fade">¿Dónde estamos?</h2>
        <p class="texto-imagenes" data-aos="fade">José A. Cabrera 5225 - C.A.B.A -</p>
        <iframe
            src="https://www.google.com/maps/embed?pb=!1m14!1m8!1m3!1d52553.99750765712!2d-58.434176!3d-34.588358!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x95bcb5895904848f%3A0x32a10d635e7ae31c!2s1516%20Cervecer%C3%ADa%20-%20Palermo!5e0!3m2!1ses!2sar!4v1786651284779!5m2!1ses!2sar"
            width="600" height="450" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"
            data-aos="fade"></iframe>
    </main>

    <footer>
        <p class="texto-footer">Todos los derechos reservados</p>
        <ul>
            <li><a href="https://www.facebook.com/?locale=es_LA" target="_blank"><img src="../img/facebook.png"
                        alt="logo facebook"></a></li>
            <li><a href="https://www.instagram.com/" target="_blank"><img src="../img/instagram.png"
                        alt="logo instagram"></a></li>
            <li><a href="https://x.com/?lang=es" target="_blank"><img src="../img/x.png" alt="logo x"></a></li>
        </ul>
    </footer>

    <!-- Scripts: Bootstrap, AOS y JS propio -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
    <script src="../js/main.js"></script>
